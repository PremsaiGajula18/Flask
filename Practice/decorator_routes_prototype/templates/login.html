{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>User Login</h2>

<form method="POST" action="{{ url_for('login') }}" style="max-width: 350px; margin-top: 20px;">
    <div style="margin-bottom: 15px;">
        <label for="username" style="display: block; margin-bottom: 5px; font-weight: 500;">Username:</label>
        <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px;">
    </div>
    <div style="margin-bottom: 20px;">
        <label for="password" style="display: block; margin-bottom: 5px; font-weight: 500;">Password:</label>
        <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px;">
    </div>
    <button type="submit" class="btn">Log In</button>
</form>

<div style="margin-top: 30px; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;">
    <strong>Test Accounts (Credentials):</strong>
    <ul style="margin: 8px 0 0 0; padding-left: 20px;">
        <li>Normal User: <code>username: alice</code> | <code>password: 123</code> (Role: <code>user</code>)</li>
        <li>Admin User: <code>username: admin</code> | <code>password: admin</code> (Role: <code>admin</code>)</li>
    </ul>
</div>
{% endblock %}
