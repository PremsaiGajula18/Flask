<!DOCTYPE html>
<html>

<head>

    <title>Student Management</title>

</head>

<body>

    <h1>Student Management</h1>


    <!-- Student Form -->

    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter student name"
            required
        >

        <button type="submit">
            Add Student
        </button>

    </form>


    <hr>


    <h2>Students</h2>

    <ul>

        {% for student in students %}

            <li>
                {{ student }}
            </li>

        {% endfor %}

    </ul>

</body>

</html>
