<!DOCTYPE html>
<html>

<head>

    <title>Student Management Using MongoDB</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>Student Management System  Using MongoDB</h1>


        <!-- Student Form -->

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
            >

            <input
                type="number"
                id="age"
                placeholder="Enter Age"
            >

            <button type="submit">
                Add Student
            </button>

        </form>


        <p id="message"></p>


        <!-- Students -->

        <h2>Students</h2>

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                </tr>

            </thead>


            <tbody>

                {% for student in students %}

                <tr>

                    <td>
                        {{ student.name }}
                    </td>

                    <td>
                        {{ student.email }}
                    </td>

                    <td>
                        {{ student.age }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
