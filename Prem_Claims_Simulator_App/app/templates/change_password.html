{% extends 'base.html' %}
{% block title %}Change Password · CarePulse{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h1 class="h5 mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-shield-lock text-primary"></i> Account Security & Password
        </h1>
      </div>
      <div class="card-body p-4">
        <p class="text-secondary small mb-4">
          Update your authentication credentials. New password must be at least 8 characters in length.
        </p>

        <form method="post" action="{{ url_for('auth.change_password') }}" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label" for="current_password">Current Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key text-secondary"></i></span>
              <input class="form-control" type="password" id="current_password" name="current_password" autocomplete="current-password" placeholder="Enter existing password" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="new_password">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
              <input class="form-control" type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-check2-circle text-secondary"></i></span>
              <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" placeholder="Re-type new password" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a class="btn btn-outline-secondary" href="{{ url_for('main.dashboard') }}">Cancel</a>
            <button class="btn btn-primary" type="submit">
              <i class="bi bi-check-lg"></i> Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
