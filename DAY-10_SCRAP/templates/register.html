{% extends "base.html" %}

{% block title %}Start Free Trial — Recruitify ATS Platform{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-card-container" style="max-width: 650px; grid-template-columns: 1fr;">
    
    <div class="auth-form-side" style="padding: 48px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="{{ url_for('index') }}" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
          <svg class="brand-logo-icon" viewBox="0 0 32 38" fill="none">
            <path d="M4 4H18C23 4 27 7.5 27 12.5C27 17.5 23 21 18 21H11V34H4V4Z" fill="#00e676"/>
            <path d="M16 21L26 34H18L10 23.5H13.5L16 21Z" fill="#00d664"/>
          </svg>
          Recruitify<span>.</span>
        </a>
        <h2>Start Your 14-Day Free Trial</h2>
        <p style="margin-bottom: 0;">No credit card required. Instant access to all features.</p>
      </div>

      <form action="{{ url_for('register') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
          <label class="form-label" style="color: var(--text-light-teal);" for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="dark-input" placeholder="e.g. Alex Miller" required>
        </div>

        <div class="form-group">
          <label class="form-label" style="color: var(--text-light-teal);" for="username">Choose Username</label>
          <input type="text" id="username" name="username" class="dark-input" placeholder="alex_recruiter" required>
        </div>

        <div class="form-group">
          <label class="form-label" style="color: var(--text-light-teal);" for="password">Create Password</label>
          <input type="password" id="password" name="password" class="dark-input" placeholder="At least 8 characters" required>
        </div>

        <button type="submit" class="btn-green-pill" style="width: 100%; justify-content: center; padding: 14px; margin-top: 10px;">
          Create Free Account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-light-teal);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--brand-green); font-weight: 700;">Sign In</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
