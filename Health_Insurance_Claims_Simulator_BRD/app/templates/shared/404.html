{% extends "base.html" %}

{% block title %}404 Not Found — Health Claims Simulator{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-secondary fw-bold mb-3"><i class="bi bi-question-circle"></i> 404</div>
        <h3 class="fw-bold">Page or Claim Not Found</h3>
        <p class="text-muted">The requested record or endpoint does not exist in this claims simulator.</p>
        <div class="mt-4">
            <a href="{{ url_for('claims.dashboard') }}" class="btn btn-primary">
                <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
